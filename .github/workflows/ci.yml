name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Restore
        run: dotnet restore Dotnetstore.CQRS.slnx

      - name: Build
        run: dotnet build Dotnetstore.CQRS.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet run --project tests/Dotnetstore.CQRS.Tests -c Release --no-build

      - name: Pack
        run: dotnet pack src/Dotnetstore.CQRS -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o ./nupkg

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./nupkg/*
          if-no-files-found: error

  publish:
    name: Publish to NuGet.org
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write # lets NuGet/login exchange the GitHub OIDC token for a short-lived API key
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: ./nupkg

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: hasse29

      - name: Push packages
        run: >
          dotnet nuget push "./nupkg/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
